name: Deploy to Server

on:
  push:
    branches:
      - main # Or your default branch like 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example: If you want to run tests/lint before deploy, you can set it up here:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - name: Install Dependencies
      #   run: npm ci
      # - name: Run Lint
      #   run: npm run lint
      
      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Assuming you clone your repo to /app on your server
          # Adjust the path to wherever your project lives on the server
          script: |
            cd /home/ubuntu/QuizWhiz-new-ui
            git pull origin main

            docker-compose up -d --build
